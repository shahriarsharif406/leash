name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Red team the demo policy
        run: python -m leash redteam
      - name: Demo scenario and audit verification
        run: |
          python -m leash demo --out out
          python -m leash verify out/audit.log
      - name: Agent integration example
        run: python examples/agent_integration.py
      - name: MCP server smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | python -m leash mcp --log out/mcp.log | grep -q leash_check_payment
